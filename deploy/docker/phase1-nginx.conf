server {
    listen 8443 ssl;
    server_name localhost;
    ssl_certificate /run/geosurvey/https.crt;
    ssl_certificate_key /run/geosurvey/https.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 64k;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    location ~ ^/(api/|openapi/|health/) {
        proxy_pass https://api:8443;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_ssl_server_name on;
        proxy_ssl_name api;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /run/geosurvey/https.crt;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
